services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel_dev_password
      POSTGRES_DB: hostel
    ports:
      - "5432:5432"
    volumes:
      - hostel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      HOSTEL_API_PORT: 3000
      DATABASE_URL: postgresql://hostel:hostel_dev_password@db:5432/hostel?schema=public
      REFRESH_TOKEN_SECRET: local-only-refresh-secret-change-before-production
      FRONTEND_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      APP_BASE_URL: http://127.0.0.1:5174
      COOKIE_SECURE: "false"
    command: ["sh", "-c", "npm run db:generate && npm run db:push && npm run db:constraints && npm run db:seed && npm run dev"]
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://127.0.0.1:3001/api/v1
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "5174:5174"
    depends_on:
      - api

volumes:
  hostel-postgres: